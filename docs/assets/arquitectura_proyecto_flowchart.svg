<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arquitectura_proyecto_flowchart-title arquitectura_proyecto_flowchart-desc" id="arquitectura_proyecto_flowchart-root">
        <title id="arquitectura_proyecto_flowchart-title">Diagrama de flujo de la arquitectura modular por capas</title>
        <desc id="arquitectura_proyecto_flowchart-desc">Flujo de la arquitectura modular por capas del sistema de control de asistencia con autenticacion, reglas de negocio, persistencia en CSV y seguridad.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #arquitectura_proyecto_flowchart-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #arquitectura_proyecto_flowchart-root { font-family: var(--font-sans); color: var(--color-ink); }
      #arquitectura_proyecto_flowchart-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#arquitectura_proyecto_flowchart-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="arquitectura_proyecto_flowchart-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arquitectura_proyecto_flowchart-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <line x1="500" y1="90" x2="500" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arquitectura_proyecto_flowchart-arrow)"/>
        <line x1="500" y1="192" x2="500" y2="208" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arquitectura_proyecto_flowchart-arrow-accent)"/>
        <line x1="450" y1="260" x2="450" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arquitectura_proyecto_flowchart-arrow)"/>
        <line x1="550" y1="260" x2="550" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arquitectura_proyecto_flowchart-arrow)"/>
        <line x1="500" y1="260" x2="500" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arquitectura_proyecto_flowchart-arrow)"/>
        <line x1="530" y1="472" x2="530" y2="484" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arquitectura_proyecto_flowchart-arrow)"/>
        <line x1="500" y1="536" x2="500" y2="552" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arquitectura_proyecto_flowchart-arrow)"/>

        <!-- Arrow labels (mask + text, always with 6-10px gap from the stroke) -->
        <rect x="446" y="196" width="32" height="8" rx="2" fill="#f5f5f5"/>
        <text x="462" y="200" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">DELEGA</text>

        <rect x="408" y="270" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="422" y="276" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">REGLAS</text>

        <rect x="512" y="300" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="530" y="306" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">VERIFICA</text>

        <rect x="512" y="330" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="528" y="336" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ACCESO</text>

        <rect x="546" y="475" width="70" height="8" rx="2" fill="#f5f5f5"/>
        <text x="581" y="479" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">IMPLEMENTA</text>

        <rect x="460" y="538" width="30" height="12" rx="2" fill="#f5f5f5"/>
        <text x="475" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ESCRIBE</text>

        <!-- Start -->
        <rect x="400" y="42" width="200" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="500" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Actor</text>
        <text x="500" y="66" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Profesor / Estudiante</text>

        <!-- Step: Capa de Presentacion -->
        <rect x="400" y="140" width="200" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">App</text>
        <text x="500" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">capa presentacion</text>

        <!-- Step: Capa de Servicios y Negocio -->
        <rect x="400" y="208" width="200" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Servicio</text>
        <text x="500" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">capa de servicios y negocio</text>

        <!-- Step: Capa de Modelos -->
        <rect x="300" y="300" width="180" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="390" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Modelo</text>
        <text x="390" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">capa de modelos</text>

        <!-- Step: Capa de Seguridad -->
        <rect x="520" y="360" width="180" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="610" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Seguridad</text>
        <text x="610" y="394" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">capa de seguridad</text>

        <!-- Step: Capa de Repositorios -->
        <rect x="440" y="420" width="180" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="530" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Repositorio</text>
        <text x="530" y="454" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">capa de repositorios</text>

        <!-- Step: Capa de Persistencia -->
        <rect x="400" y="484" width="200" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Almacenamiento</text>
        <text x="500" y="518" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">capa de persistencia (csv)</text>

        <!-- End -->
        <rect x="400" y="552" width="200" height="48" rx="20" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="500" y="566" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Persistencia</text>
        <text x="500" y="576" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CSV · 13 catalogos</text>

        <!-- Legend -->
        <line x1="40" y1="650" x2="960" y2="650" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="666" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="636" width="24" height="12" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="72" y="646" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end (oval)</text>

        <rect x="200" y="636" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="232" y="646" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step (rectangle)</text>

        <line x1="400" y1="646" x2="428" y2="646" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arquitectura_proyecto_flowchart-arrow)"/>
        <text x="436" y="646" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flow</text>

        <line x1="620" y1="646" x2="648" y2="646" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arquitectura_proyecto_flowchart-arrow-accent)"/>
        <text x="656" y="646" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Happy path</text>
      </svg>
